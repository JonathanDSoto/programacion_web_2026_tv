<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>

	<div class="conteiner">
		 
		<div class="head_list">
			<input id="title_element" type="text" name="" >
			<button onclick="updateList()">
				Add
			</button>
		</div>

		<div id="content_list">
			
			<div class="element_list">
				
				<input type="radio" name="">
				<label>text</label>

			</div>

		</div>

	</div>
	<script>
		
		showList()

		function updateList() {

			var data = localStorage.getItem("data_list");
			data = JSON.parse(data)

			if (data === null) {
				data = [];
			}
			
			let element = {
				title: document.getElementById('title_element').value ,
				status: false
			};

			data.push(element);

			localStorage.setItem("data_list", JSON.stringify(data));

			

			showList()

			 
		}

		function showList()
		{
			var data = localStorage.getItem("data_list");
			data = JSON.parse(data)

			if (data === null) {
				data = [];
			}

			data.forEach((element) => { 

				let element_list = '<div class="element_list"> <input type="radio" name=""> <label>'+element.title+'</label> </div>'

				document.getElementById('content_list').innerHTML = document.getElementById('content_list').innerHTML + element_list
			});
		}

	</script>
</body>
</html>
